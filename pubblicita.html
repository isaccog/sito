<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <title>Guida pornografica alla pubblcità</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/caroselli.css">
    <script src="/config.js"></script>
</head>

<body>
    <div id="header"></div>
    <main>
        <div codtrad="cronaca porn" class="gallery-title">Guida pornografica della pubblicita</div>
        <div codtrad="cronaca description" class="gallery-description">E' pornografico ciò che mostra esplicitamente qualcosa che si vorrebbe celato. 
            <br>In questa raccolta di testi e immagini degli zelanti esperti di marketing non hanno coperto sufficentemente le oscenità che volevano raccontarci.
        </div>

        <div id="image-loader" class="loader"></div>
        <div id="imageCarousel" class="carousel slide" style="display:none;">
            <div class="carousel-inner" id="carousel-images"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <div id="quote-loader" class="loader"></div>
        <div id="quoteCarousel" class="carousel slide quote-slider" style="display:none; margin-top: 4rem;">
            <div class="carousel-inner" id="carousel-quotes"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#quoteCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#quoteCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </main>
    <div id="footer"></div>

    <script>
      async function loadImages() {
        try {
          const lang = localStorage.getItem("lang") || "it";
          const response = await fetch(`${BACKEND}/pubblicita?lang=${lang}`);
          if (!response.ok) throw new Error("Errore fetch pubblicita");
          const pubblicita = await response.json();

          const carousel = document.getElementById('carousel-images');
          carousel.innerHTML = '';

          pubblicita.forEach((item, index) => {
            const activeClass = index === 0 ? 'active' : '';
            const html = `
              <div class="carousel-item ${activeClass}">
                <img src="${item.url}" class="d-block w-100" alt="Pubblicità">
                <div class="carousel-caption d-none d-md-block">
                  <p>${item.description || ''}</p>
                </div>
              </div>`;
            carousel.innerHTML += html;
          });

          document.getElementById('image-loader').style.display = 'none';
          document.getElementById('imageCarousel').style.display = 'block';
          new bootstrap.Carousel(carousel.closest('.carousel'), { interval: 30000, ride: 'carousel', pause: 'hover' });
        } catch (error) {
          console.error("Errore caricamento immagini:", error);
        }
      }

      async function loadQuotes() {
        document.getElementById('quote-loader').style.display = 'none';
        try {
          const lang = localStorage.getItem("lang") || "it";
          const response = await fetch(`${BACKEND}/citazioni?lang=${lang}`);
          if (!response.ok) throw new Error("Errore fetch citazioni");
          const quotes = await response.json();
          if (!quotes.length) return false;

          const container = document.getElementById("carousel-quotes");
          container.innerHTML = "";
          quotes.forEach((quote, index) => {
            const activeClass = index === 0 ? "active" : "";
            container.innerHTML += `
              <div class="carousel-item ${activeClass}">
                <div class="d-block w-100 p-4 text-center">
                  <blockquote class="blockquote">
                    <p>${quote.testo || ""}</p>
                    <footer class="blockquote-footer">${quote.autore || ""}</footer>
                  </blockquote>
                </div>
              </div>`;
          });

          document.getElementById("quoteCarousel").style.display = 'block';
          new bootstrap.Carousel(document.getElementById('quoteCarousel'), { interval: 30000, ride: 'carousel', pause: 'hover' });
          return true;
        } catch (error) {
          console.error("Errore caricamento citazioni:", error);
          return false;
        }
      }

      function addCarouselCounters(carouselId) {
        const carousel = document.getElementById(carouselId);
        const counter = document.createElement('div');
        counter.className = 'carousel-counter';
        counter.id = `${carouselId}-counter`;
        carousel.appendChild(counter);
        updateCounter(carouselId);
        carousel.addEventListener('slid.bs.carousel', () => updateCounter(carouselId));
      }

      function updateCounter(carouselId) {
        const items = document.querySelectorAll(`#${carouselId} .carousel-item`);
        const activeIndex = [...items].findIndex(i => i.classList.contains('active')) + 1;
        document.getElementById(`${carouselId}-counter`).textContent = `${activeIndex}/${items.length}`;
      }

      document.addEventListener('DOMContentLoaded', () => {
        loadImages().then(() => addCarouselCounters('imageCarousel'));
        loadQuotes().then(shown => { if (shown) addCarouselCounters('quoteCarousel'); });
      });
    </script>
    <script src="/func.js"></script> <!-- Deve stare qui -->
    <script>
        function toggleMenu() {
          const menu = document.getElementById('fullScreenMenu');
          menu.classList.toggle('show');
        }
      </script>
      </body>
</html>
